<!DOCTYPE html>

<html class="dark" lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PsycheInsight | Quiz Interattivo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "surface-variant": "#2d3449",
                "error-container": "#93000a",
                "primary-container": "#5d5cff",
                "on-background": "#dae2fd",
                "secondary-fixed-dim": "#3cddc7",
                "secondary": "#44e2cd",
                "on-primary-fixed": "#09006b",
                "on-secondary-fixed": "#00201c",
                "primary-fixed": "#e1dfff",
                "surface-dim": "#0b1326",
                "secondary-fixed": "#62fae3",
                "on-surface-variant": "#c7c4d8",
                "tertiary-container": "#9a46e9",
                "on-tertiary-container": "#fff8fd",
                "on-error-container": "#ffdad6",
                "on-secondary-fixed-variant": "#005047",
                "tertiary": "#ddb7ff",
                "surface-container-lowest": "#060e20",
                "surface-tint": "#c1c1ff",
                "inverse-surface": "#dae2fd",
                "surface-bright": "#31394d",
                "on-primary": "#1500a8",
                "secondary-container": "#03c6b2",
                "tertiary-fixed": "#f0dbff",
                "on-surface": "#dae2fd",
                "background": "#0b1326",
                "on-primary-container": "#fdf9ff",
                "surface-container-low": "#131b2e",
                "tertiary-fixed-dim": "#ddb7ff",
                "on-secondary-container": "#004d44",
                "surface": "#0b1326",
                "surface-container-highest": "#2d3449",
                "outline": "#908fa1",
                "on-primary-fixed-variant": "#2b20d2",
                "surface-container-high": "#222a3d",
                "primary": "#c1c1ff",
                "error": "#ffb4ab",
                "on-tertiary": "#490080",
                "primary-fixed-dim": "#c1c1ff",
                "inverse-primary": "#4643e9",
                "on-secondary": "#003731",
                "on-tertiary-fixed-variant": "#6900b3",
                "outline-variant": "#464556",
                "inverse-on-surface": "#283044",
                "on-tertiary-fixed": "#2c0051",
                "on-error": "#690005",
                "surface-container": "#171f33"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "container-padding": "24px",
                "gutter": "16px",
                "stack-gap": "32px",
                "unit": "8px"
            },
            "fontFamily": {
                "body-md": ["Inter"],
                "label-caps": ["Inter"],
                "headline-md": ["Montserrat"],
                "body-lg": ["Inter"],
                "display-lg": ["Montserrat"],
                "display-lg-mobile": ["Montserrat"]
            },
            "fontSize": {
                "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600"}],
                "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0b1326;
            overflow: hidden;
            margin: 0;
            padding: 0;
            color: #dae2fd;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .option-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .option-button:hover {
            background: rgba(68, 226, 205, 0.1);
            border-color: #44e2cd;
            box-shadow: 0 0 20px rgba(68, 226, 205, 0.2);
            transform: translateY(-2px);
        }

        .option-button:active {
            transform: scale(0.98);
        }

        .progress-glow {
            box-shadow: 0 0 15px rgba(68, 226, 205, 0.6);
        }

        @keyframes pulse-teal {
            0% { box-shadow: 0 0 0 0 rgba(68, 226, 205, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(68, 226, 205, 0); }
            100% { box-shadow: 0 0 0 0 rgba(68, 226, 205, 0); }
        }

        .selected-pulse {
            animation: pulse-teal 0.6s ease-out;
            background: rgba(68, 226, 205, 0.2) !important;
            border-color: #44e2cd !important;
        }

        .gradient-bg {
            background: radial-gradient(circle at 20% 30%, rgba(68, 226, 205, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(154, 70, 233, 0.15) 0%, transparent 40%),
                        #0b1326;
        }
    </style>
</head>
<body class="font-body-md text-body-md gradient-bg min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Top AppBar (from JSON) -->
<header class="fixed top-0 w-full z-50 bg-surface/40 dark:bg-surface/40 backdrop-blur-xl border-b border-white/10 shadow-indigo-900/40 shadow-xl">
<div class="flex justify-between items-center px-container-padding py-unit max-w-[1200px] mx-auto">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">PsycheInsight</h1>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-surface-variant hover:text-secondary transition-colors duration-300 active:scale-95">help</button>
<button class="material-symbols-outlined text-on-surface-variant hover:text-secondary transition-colors duration-300 active:scale-95">account_circle</button>
</div>
</div>
</header>
<!-- Animated Background Elements -->
<div class="absolute inset-0 z-0 pointer-events-none">

</div>
<!-- Main Quiz Container -->
<main class="relative z-10 w-full max-w-[1200px] px-container-padding flex items-center justify-center min-h-screen">
<div class="glass-panel w-full max-w-2xl rounded-3xl p-8 md:p-12 shadow-2xl flex flex-col gap-8 transform transition-all duration-500" id="quiz-card">
<!-- Progress Header -->
<div class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-widest">Question 1 of 5</span>
<span class="font-label-caps text-label-caps text-on-surface-variant/60">20% Complete</span>
</div>
<div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
<div class="h-full w-[20%] bg-gradient-to-r from-secondary to-tertiary progress-glow transition-all duration-700"></div>
</div>
</div>
<!-- Question Text -->
<div class="space-y-4">
<h2 class="font-headline-md text-headline-md md:text-display-lg-mobile text-on-surface leading-tight">
                    Come reagisci solitamente a un cambiamento improvviso nella tua routine quotidiana?
                </h2>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-1 gap-4">
<button class="option-button group flex items-center p-6 rounded-2xl text-left" onclick="selectOption(this)">
<span class="flex-shrink-0 w-10 h-10 rounded-full border border-white/10 bg-white/5 flex items-center justify-center mr-6 font-bold group-hover:border-secondary group-hover:text-secondary transition-all">A</span>
<span class="font-body-lg text-body-lg text-on-surface">Mi adatto rapidamente</span>
</button>
<button class="option-button group flex items-center p-6 rounded-2xl text-left" onclick="selectOption(this)">
<span class="flex-shrink-0 w-10 h-10 rounded-full border border-white/10 bg-white/5 flex items-center justify-center mr-6 font-bold group-hover:border-secondary group-hover:text-secondary transition-all">B</span>
<span class="font-body-lg text-body-lg text-on-surface">Provo un po' di ansia ma mi abituo</span>
</button>
<button class="option-button group flex items-center p-6 rounded-2xl text-left" onclick="selectOption(this)">
<span class="flex-shrink-0 w-10 h-10 rounded-full border border-white/10 bg-white/5 flex items-center justify-center mr-6 font-bold group-hover:border-secondary group-hover:text-secondary transition-all">C</span>
<span class="font-body-lg text-body-lg text-on-surface">Preferisco pianificare tutto in anticipo</span>
</button>
<button class="option-button group flex items-center p-6 rounded-2xl text-left" onclick="selectOption(this)">
<span class="flex-shrink-0 w-10 h-10 rounded-full border border-white/10 bg-white/5 flex items-center justify-center mr-6 font-bold group-hover:border-secondary group-hover:text-secondary transition-all">D</span>
<span class="font-body-lg text-body-lg text-on-surface">Mi sento sopraffatto e ho bisogno di tempo</span>
</button>
</div>
<!-- Contextual Hint -->
<div class="flex items-center gap-2 text-on-surface-variant/40 justify-center">
<span class="material-symbols-outlined text-[18px]">psychology</span>
<p class="font-label-caps text-[10px] uppercase">Rifletti sulla tua reazione istintiva</p>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Suppressed because Transactional Context - Quiz active) -->
<!-- Determined via "Shell Visibility & Relevance" rule: suppression on task-focused quiz screens -->
<script>
        function selectOption(el) {
            // Remove selection from all
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.classList.remove('selected-pulse');
                btn.style.opacity = '0.5';
            });

            // Highlight selected
            el.classList.add('selected-pulse');
            el.style.opacity = '1';

            // Simulate transition to next question
            setTimeout(() => {
                const card = document.getElementById('quiz-card');
                card.style.opacity = '0';
                card.style.transform = 'translateY(-20px) scale(0.98)';
                
                // In a real app, logic for next question would trigger here
                console.log('Progressing to Question 2...');
            }, 800);
        }

        // Mouse trailing light effect (Ambient)
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(68, 226, 205, 0.08) 0%, transparent 35%), radial-gradient(circle at 20% 30%, rgba(68, 226, 205, 0.15) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(154, 70, 233, 0.15) 0%, transparent 40%), #0b1326`;
        });
    </script>
</body></html>
